{% extends 'base.html' %}

{% block title %}Criar Conta — TechShop{% endblock %}

{% block content %}
{% include 'navbar.html' %}
<div class="container mt-4" style="max-width: 460px;">
    <div class="card form-card">
        <div class="card-header py-3 text-center">
            <h1 class="h4 mb-0"><i class="bi bi-person-plus me-2"></i>Criar sua conta</h1>
        </div>
        <div class="card-body p-4">
            <form method="post" action="{% url 'register' %}">
                {% csrf_token %}
                {% load crispy_forms_tags %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-brand w-100 mt-3">
                    <i class="bi bi-check-lg me-1"></i>Criar conta
                </button>
            </form>
            <hr>
            <p class="text-center small text-muted mb-0">
                Já tem conta? <a href="{% url 'login' %}">Entrar</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
